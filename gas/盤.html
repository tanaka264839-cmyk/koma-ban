<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<base target="_blank">
<title>予定の盤</title>
<style>
:root {
  color-scheme: light;
  --地: #f6f1e7;
  --字: #2b2118;
  --薄い字: #5a4a3a;
  --線: #6b4a2b;
  --駒の縁: #7a5634;
  --赤: #b23a2a;
}
html, body { margin: 0; background: var(--地); color: var(--字); }
body { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; font-size: 15px; line-height: 1.6; }
.全体 { max-width: 1180px; margin: 0 auto; padding: 12px 16px 28px; box-sizing: border-box; }
h1 { font-size: 22px; margin: 2px 0 0; letter-spacing: 1px; }
.副 { margin: 0; color: var(--薄い字); font-size: 14px; }
.案内 { margin: 8px 0 10px; font-weight: bold; }
main { display: flex; gap: 20px; align-items: flex-start; }
.盤の場所 { flex: 1 1 auto; min-width: 0; position: relative; }
.横 { flex: 0 0 340px; min-width: 0; }
@media (max-width: 900px) {
  main { flex-direction: column; }
  .横 { flex-basis: auto; width: 100%; }
}
.日のタブ { display: flex; gap: 6px; margin: 0 auto; padding-left: 4px; box-sizing: border-box; }
.日のタブ button { border-radius: 8px 8px 0 0; border-bottom: 0; background: #fffaf2; padding: 4px 12px; font-size: 14px; }
.日のタブ button[aria-selected="true"] { background: #e9c27c; }
.日のタブ button.乗っている { outline: 3px dashed var(--線); outline-offset: -3px; }
.日のタブ button.乗っている.置けない { outline-color: var(--赤); }
.日のタブ button.光る { animation: 光る 1.2s ease; }
@keyframes 光る { 0% { background: #fff1a8; } 100% { background: #fffaf2; } }
.日のタブ[hidden] { display: none; }
.盤 {
  position: relative; margin: 0 auto;
  background: linear-gradient(135deg, #e9c27c 0%, #dcae63 55%, #e4ba72 100%);
  border: 3px solid #5b3d22; border-radius: 6px; box-shadow: 0 6px 18px rgba(70, 45, 20, .3);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.背景, .駒の層 { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
.背景 > div { position: absolute; box-sizing: border-box; }
.列の見出し { line-height: 30px; text-align: center; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; color: #2b1a0c; }
.列の見出し.休み { color: #5a4632; font-size: 12px; }
.細い .列の見出し { line-height: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; }
.細い .列の見出し.休み { font-size: 10px; }
.休みの列 { background: rgba(90, 60, 30, .28); }
.横線 { border-top: 1px dotted rgba(91, 61, 34, .55); }
.横線.太 { border-top: 1px solid var(--線); }
.縦線 { border-left: 1px solid var(--線); }
.時刻 { text-align: right; font-size: 12px; font-weight: bold; color: #3d2a18; line-height: 16px; }
.駒 { position: absolute; z-index: 3; cursor: grab; touch-action: none; }
.駒:not(.持ち上げ) { transition: left .15s ease, top .15s ease; }
.駒の縁, .駒の面 { position: absolute; clip-path: polygon(50% 0, 94% 9px, 100% 100%, 0 100%, 6% 9px); }
.駒の縁 { left: 0; top: 0; right: 0; bottom: 0; background: var(--駒の縁); }
.駒の面 {
  left: 1px; top: 1px; right: 1px; bottom: 1px; background: linear-gradient(180deg, #fbe9c4, #f0d29a);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 2px 1px; box-sizing: border-box; text-align: center; overflow: hidden;
}
.駒の時 { font-size: 10px; font-weight: bold; color: #5a4632; line-height: 1.1; }
.駒の名 { font-family: "Yu Mincho", "游明朝", "Hiragino Mincho ProN", "MS Mincho", serif; font-weight: bold; font-size: 13px; line-height: 1.2; color: #24170d; }
.細い .駒の面 { padding-top: 6px; }
.細い .駒の時 { font-size: 9px; }
.細い .駒の名 { font-size: 11px; }
.駒.持ち上げ { z-index: 10; cursor: grabbing; filter: drop-shadow(0 12px 9px rgba(40, 25, 10, .45)); }
.影 { position: absolute; z-index: 9; border: 3px dashed var(--線); border-radius: 6px; box-sizing: border-box; background: rgba(255, 250, 240, .35); pointer-events: none; }
.影.置けない { border-color: var(--赤); background: rgba(255, 235, 230, .55); }
.吹き出し {
  position: absolute; z-index: 20; max-width: 290px; background: #fff4f1; border: 2px solid var(--赤); color: #8f2416;
  font-weight: bold; font-size: 14px; line-height: 1.5; padding: 6px 10px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0, 0, 0, .15); pointer-events: none;
}
.吹き出し.注意 { background: #fffbea; border-color: #8a6d00; color: #5c4800; }
.様子 { border: 2px solid #222; border-radius: 6px; background: #fff; padding: 6px 10px; font-weight: bold; min-height: 1.6em; }
.様子.書いている { border-color: #8a6d00; }
.様子.注意 { border-color: var(--赤); color: #8f2416; }
.ボタン { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
button { font: inherit; font-weight: bold; border: 2px solid #5b3d22; border-radius: 6px; background: #fff; padding: 6px 12px; cursor: pointer; color: var(--字); }
button:disabled { opacity: .45; cursor: default; }
.鍵の字 { font-size: 12px; color: var(--薄い字); margin-left: 6px; font-weight: normal; }
.横 h2 { font-size: 15px; margin: 14px 0 6px; }
.棋譜 { list-style: none; margin: 0; padding: 8px 10px; background: #fffaf2; border: 1px solid #cdb79a; border-radius: 8px; max-height: 190px; overflow-y: auto; font-size: 14px; }
.棋譜 li { margin: 2px 0; }
.棋譜 li.書いている, .棋譜 li.空 { color: var(--薄い字); }
.小 { font-size: 12px; color: var(--薄い字); margin: 0 0 4px; }
.表の中身 { overflow-x: auto; background: #fff; border: 1px solid #999; border-radius: 6px; }
.表の中身 table { border-collapse: collapse; font-size: 11px; table-layout: fixed; width: 100%; }
.表の中身 td { border: 1px solid #d0d0d0; padding: 0 2px; height: 16px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.表の中身 col.行番の列 { width: 24px; }
.表の中身 col.時刻の列 { width: 40px; }
.表の中身 td.行番, .表の中身 td.時刻の枡 { text-overflow: clip; }
@media (max-width: 480px) { .表の中身 table { font-size: 10px; } }
.表の中身 tr.頭 td, .表の中身 td.行番 { background: #eee; color: #555; text-align: center; }
.幕 { position: absolute; z-index: 30; left: 0; top: 0; right: 0; bottom: 0; background: rgba(246, 241, 231, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; text-align: center; }
.幕[hidden] { display: none; }
.幕 p { font-weight: bold; max-width: 480px; margin: 0 0 12px; }
footer { margin-top: 18px; font-size: 12px; color: var(--薄い字); }
</style>
</head>
<body>
<div class="全体">
  <header>
    <h1>予定の盤</h1>
    <p class="副">Google スプレッドシートと Google Apps Script で動いています</p>
  </header>
  <main>
    <section class="盤の場所" id="盤の場所">
      <p class="案内">駒をつかんで、動かしてみてください。日のタブに乗せると、ほかの日へも動かせます</p>
      <div class="日のタブ" id="日のタブ" role="tablist" aria-label="盤の日" hidden></div>
      <div class="盤" id="盤" aria-label="予定の盤（担当×時刻）">
        <div class="背景" id="背景"></div>
        <div class="駒の層" id="駒の層"></div>
        <div class="影" id="影" hidden></div>
        <div class="吹き出し" id="吹き出し" hidden></div>
      </div>
      <div class="幕" id="幕" hidden>
        <p id="幕の字"></p>
        <button type="button" id="幕のボタン" hidden>はじめの形に戻す</button>
      </div>
    </section>
    <aside class="横">
      <div class="様子" id="様子" role="status" aria-live="polite">表を読んでいます…</div>
      <div class="ボタン">
        <button type="button" id="待った">待った（一手戻す）<span class="鍵の字">Ctrl+Z</span></button>
        <button type="button" id="はじめ">はじめの形に戻す</button>
      </div>
      <h2>棋譜（動かした記録）</h2>
      <ol class="棋譜" id="棋譜"></ol>
      <h2>Google スプレッドシートのいまの中身</h2>
      <p class="小">表の「盤」のシートを、動かすたびに読み戻しています</p>
      <div class="表の中身" id="表の中身"></div>
    </aside>
  </main>
  <footer>この盤の人と予定は、すべて作り物です。盤はみんなで1つです（ほかの人が動かすと、こちらにも出ます）。10分だれも動かさないと、はじめの形に戻ります。</footer>
</div>
<script>
/*
 * 予定の盤：芯（判断だけを置く所）
 *
 * 画面（ブラウザ）と Google Apps Script の両方が、この同じ1つを使う。
 * だから、画面が「置ける」と見た手を、Google Apps Script も同じ決まりで確かめ直せる。
 *
 * 言葉
 *   日   … 盤の日。3つ（今日を含む平日3日）。駒の中では 0・1・2 の番号で持ち、表には日付の字（yyyy-MM-dd）で書く。
 *   盤   … 日ごとに、担当（列）× 時刻（段）。9:00〜18:00 を30分ずつ 18段。段0＝9:00。
 *   駒   … 予定1つ。{ 番号, 予定, 日, 担当, 段（始まりの段）, 段数 }
 *   一覧 … 駒の正本（表の「一覧」のシート）。盤は一覧から描く。
 *   棋譜 … 動かした記録。待った（一手戻す）は、戻した手の番号を持つ1行。
 *
 * ここには、表・画面・時計に触る物を置かない（同じ入力なら、いつも同じ答え）。今日の日付も、外から受け取る。
 */
var 芯 = (function () {
  'use strict';

  var 担当たち = Object.freeze(['Aさん', 'Bさん', 'Cさん', 'Dさん', 'Eさん', '未定']);
  var 日の数 = 3;
  // 日ごとの休み（1日目 Dさん・2日目 Eさん・3日目 なし）
  var 休みの担当たち = Object.freeze([Object.freeze(['Dさん']), Object.freeze(['Eさん']), Object.freeze([])]);
  var 段の数 = 18;
  var 始まりの分 = 9 * 60;
  var 段の分 = 30;
  var 表の形の版 = 2; // シートの形（列）を変えたら上げる。表の形がこれと違えば、整え直す

  // 表の「盤」のシートの色。同じ列でとなり合う駒は交互の色にして、1つに見えないようにする。
  var 塗りの色 = Object.freeze({ 駒: Object.freeze(['#f3d9a4', '#e6c07c']), 休み: '#d6d6d6', 空き: '#ffffff', 見出し: '#eeeeee', 日付: '#dddddd' });

  var はじめの形 = [
    { 番号: 1, 予定: '来客対応', 日: 0, 担当: 'Aさん', 段: 2, 段数: 2 },
    { 番号: 2, 予定: '資料の整理', 日: 0, 担当: 'Aさん', 段: 12, 段数: 3 },
    { 番号: 3, 予定: '打ち合わせ', 日: 0, 担当: 'Bさん', 段: 3, 段数: 3 },
    { 番号: 4, 予定: '現場の点検', 日: 0, 担当: 'Bさん', 段: 10, 段数: 4 },
    { 番号: 5, 予定: '週の会議', 日: 0, 担当: 'Cさん', 段: 0, 段数: 2 },
    { 番号: 6, 予定: '見積り作成', 日: 0, 担当: 'Cさん', 段: 8, 段数: 4 },
    { 番号: 7, 予定: '研修', 日: 0, 担当: 'Eさん', 段: 14, 段数: 3 },
    { 番号: 8, 予定: '書類の確認', 日: 0, 担当: '未定', 段: 4, 段数: 3 },
    { 番号: 9, 予定: '打ち合わせ', 日: 1, 担当: 'Aさん', 段: 2, 段数: 3 },
    { 番号: 10, 予定: '現場の点検', 日: 1, 担当: 'Cさん', 段: 8, 段数: 4 },
    { 番号: 11, 予定: '来客対応', 日: 1, 担当: 'Dさん', 段: 4, 段数: 2 },
    { 番号: 12, 予定: '資料の整理', 日: 1, 担当: '未定', 段: 10, 段数: 3 },
    { 番号: 13, 予定: '研修', 日: 2, 担当: 'Bさん', 段: 1, 段数: 3 },
    { 番号: 14, 予定: '見積り作成', 日: 2, 担当: 'Eさん', 段: 8, 段数: 3 },
    { 番号: 15, 予定: '書類の確認', 日: 2, 担当: '未定', 段: 2, 段数: 2 }
  ];

  var 一覧の見出し = Object.freeze(['番号', '予定', '日付', '担当', '始まり', '終わり']);
  var 棋譜の見出し = Object.freeze(['手', 'いつ', '何を', '駒', '予定', '前の日付', '前の担当', '前の始まり', '後の日付', '後の担当', '後の始まり', '戻した手']);
  var 曜日 = '日月火水木金土';

  // ---------- 小さな道具 ----------

  function 写す(駒たち) {
    return 駒たち.map(function (駒) {
      return { 番号: 駒.番号, 予定: 駒.予定, 日: 駒.日, 担当: 駒.担当, 段: 駒.段, 段数: 駒.段数 };
    });
  }

  function はじめの駒たち() {
    return 写す(はじめの形);
  }

  function 番号の順(駒たち) {
    return 駒たち.slice().sort(function (a, b) { return a.番号 - b.番号; });
  }

  // 入口で形をそろえる：全角→半角（NFKC）。詰める＝空白をすべて除く（番号・日付・担当・時刻）。整える＝前後の空白だけ除く（予定の名前）。
  function 字にする(値) {
    if (値 === null || 値 === undefined) return '';
    var 字 = String(値);
    return typeof 字.normalize === 'function' ? 字.normalize('NFKC') : 字;
  }
  function 詰める(値) {
    return 字にする(値).replace(/\s+/g, '');
  }
  function 整える(値) {
    return 字にする(値).trim();
  }

  function 整数か(値) {
    return typeof 値 === 'number' && isFinite(値) && Math.floor(値) === 値;
  }

  function 二桁(数) {
    return (数 < 10 ? '0' : '') + 数;
  }

  function 段から時刻(段) {
    var 分 = 始まりの分 + 段 * 段の分;
    return Math.floor(分 / 60) + ':' + 二桁(分 % 60);
  }

  // 「10:30」→ 3。盤の上の30分きざみの時刻（9:00〜18:00）でなければ null（読めない）。
  function 時刻から段(値) {
    var 字 = 詰める(値);
    var 形 = /^(\d{1,2}):(\d{2})$/.exec(字);
    if (!形) return null;
    var 時 = Number(形[1]);
    var 分 = Number(形[2]);
    if (分 >= 60) return null;
    var 差 = 時 * 60 + 分 - 始まりの分;
    if (差 < 0 || 差 % 段の分 !== 0) return null;
    var 段 = 差 / 段の分;
    return 段 <= 段の数 ? 段 : null;
  }

  function 担当の列(担当) {
    return 担当たち.indexOf(担当);
  }

  function 休みか(担当, 日) {
    var 休み = 休みの担当たち[日];
    return !!休み && 休み.indexOf(担当) >= 0;
  }

  function 番号で探す(駒たち, 番号) {
    for (var i = 0; i < 駒たち.length; i++) {
      if (駒たち[i].番号 === 番号) return 駒たち[i];
    }
    return null;
  }

  function 重なるか(a段, a段数, b段, b段数) {
    return a段 < b段 + b段数 && b段 < a段 + a段数;
  }

  function 重なる駒を探す(駒たち, 番号, 日, 担当, 段, 段数) {
    for (var i = 0; i < 駒たち.length; i++) {
      var 他 = 駒たち[i];
      if (他.番号 === 番号) continue; // 自分とは重ならない
      if (他.日 !== 日 || 他.担当 !== 担当) continue;
      if (重なるか(段, 段数, 他.段, 他.段数)) return 他;
    }
    return null;
  }

  // ---------- 日付 ----------

  function 日付の部品(字) {
    var 形 = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(字));
    if (!形) return null;
    var 時 = Date.UTC(Number(形[1]), Number(形[2]) - 1, Number(形[3]));
    var 日 = new Date(時);
    if (日.getUTCMonth() !== Number(形[2]) - 1 || 日.getUTCDate() !== Number(形[3])) return null;
    return { 時: 時, 年: 日.getUTCFullYear(), 月: 日.getUTCMonth() + 1, 日: 日.getUTCDate(), 曜: 日.getUTCDay() };
  }

  function 日付の字(時) {
    var 日 = new Date(時);
    return 日.getUTCFullYear() + '-' + 二桁(日.getUTCMonth() + 1) + '-' + 二桁(日.getUTCDate());
  }

  // 今日（yyyy-MM-dd）から、今日を含む平日（土日を飛ばす）を 数 だけ並べる
  function 日たちを作る(今日の字, 数) {
    var 部品 = 日付の部品(今日の字);
    if (!部品) return null;
    var 並び = [];
    var 時 = 部品.時;
    while (並び.length < 数) {
      var 曜 = new Date(時).getUTCDay();
      if (曜 !== 0 && 曜 !== 6) 並び.push(日付の字(時));
      時 += 24 * 3600 * 1000;
    }
    return 並び;
  }

  function 日たちの形か(日たち) {
    if (!Array.isArray(日たち) || 日たち.length !== 日の数) return false;
    for (var i = 0; i < 日たち.length; i++) {
      if (!日付の部品(日たち[i])) return false;
      if (i > 0 && !(日たち[i - 1] < 日たち[i])) return false;
    }
    return true;
  }

  // 「2026-11-27」→「11/27(金)」
  function 日の名前(日付) {
    var 部品 = 日付の部品(日付);
    return 部品 ? 部品.月 + '/' + 部品.日 + '(' + 曜日.charAt(部品.曜) + ')' : String(日付);
  }

  function 日の名前たち(日たち) {
    return 日たち.map(日の名前);
  }

  // 表の日付の字（yyyy-MM-dd・yyyy/M/d・M/D）を、日たちの中の番号にする。無ければ null
  function 日を読む(値, 日たち) {
    var 字 = 詰める(値);
    var 形 = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/.exec(字);
    if (形) return 位置(日たち, 形[1] + '-' + 二桁(Number(形[2])) + '-' + 二桁(Number(形[3])));
    形 = /^(\d{1,2})\/(\d{1,2})$/.exec(字);
    if (!形) return null;
    for (var i = 0; i < 日たち.length; i++) {
      var 部品 = 日付の部品(日たち[i]);
      if (部品 && 部品.月 === Number(形[1]) && 部品.日 === Number(形[2])) return i;
    }
    return null;
  }

  function 位置(並び, 物) {
    var i = 並び.indexOf(物);
    return i >= 0 ? i : null;
  }

  // ---------- 動かす ----------

  // 指の下に残す：駒の何段目をつかんだか（駒の外を指していても、駒の中に収める）
  function つかんだ段(駒, 指の段) {
    var 段 = 指の段 - 駒.段;
    if (段 < 0) return 0;
    if (段 > 駒.段数 - 1) return 駒.段数 - 1;
    return 段;
  }

  // 指の下の段と、つかんだ段から、行き先の始まりの段を出す
  function 行き先の段(指の段, つかんだ) {
    return 指の段 - つかんだ;
  }

  // 答えは字で返す（二択にしない）：置ける／同じ所／重なる／はみ出す／知らない駒
  function 行き先を調べる(駒たち, 番号, 行き先) {

    幕を閉じる();
    描き直す();
    if (!送る列.length) 様子を書く('表に書きました（' + 秒.toFixed(1) + '秒）' + (返事.訳 ? '　' + 返事.訳 : ''));
    送る();
  }

  // 書かなかった・分からない時：残りの手を捨て、表の形に合わせて、訳を言う
  function 合わせ直す(文, 姿, 返事) {
    世代 += 1;
    送る列 = [];
    送っている = null;
    if (姿) 表の姿 = 姿;
    画面の駒たち = 表の姿 && 表の姿.駒たち ? 芯.写す(表の姿.駒たち) : [];
    描き直す();
    if (返事 && 返事.結果 === '読めない') 幕を出す('表の一覧が読めません。' + 返事.訳, true);
    else if (返事 && 返事.結果 === '休み') 幕を出す(返事.訳, false);
    様子を書く(文, '注意');
    ボタンを整える();
  }

  function 列に入れる(口, 頼み, 手) {
    送る列.push({ 口: 口, 頼み: 頼み, 手: 手 });
    描き直す();
    送る();
  }

  function 動かす(番号, 元, 行き先) {
    var 結果 = 芯.駒を動かす(画面の駒たち, 番号, 行き先);
    if (結果.形 !== '置ける') return 結果;
    var 駒 = 芯.番号で探す(画面の駒たち, 番号);
    画面の駒たち = 結果.駒たち;
    列に入れる('駒を動かす', { 通し番号: ++通し, 番号: 番号, 見ていた: 元, 行き先: 行き先 },
      { 何を: '動かす', 駒: 番号, 予定: 駒.予定, 前: 元, 後: 行き先 });
    return 結果;
  }

  function 待った() {
    if (持ち || !表の姿) return;
    触った();
    var 並び = 見えている戻せる手();
    if (!並び.length) {
      様子を書く('戻す手がありません', '注意');
      return;
    }
    var 的 = 並び[0];
    var 結果 = 芯.駒を動かす(画面の駒たち, 的.駒, 的.前);
    if (結果.形 !== '置ける') {
      様子を書く(芯.知らせの文(結果) || '戻せませんでした', '注意');
      return;
    }
    画面の駒たち = 結果.駒たち;
    列に入れる('一手戻す', { 通し番号: ++通し, 番号: 的.駒, 見ていた: 的.後, 行き先: 的.前 },
      { 何を: '待った', 駒: 的.駒, 予定: 的.予定, 前: 的.後, 後: 的.前, 戻す: 的 });
    if (的.前.日 !== 表示の日) タブを光らせる(的.前.日); // ほかの日へ戻った
  }

  function はじめに戻す() {
    if (持ち || !表の姿) return;
    触った();
    画面の駒たち = 芯.はじめの駒たち();
    列に入れる('はじめの形に戻す', { 通し番号: ++通し }, { 何を: 'はじめ' });
  }

  // ---------- つかむ・動かす・離す（マウスと指を1つの作りで） ----------
  function 指の下の行き先(x, y) {
    var 枠 = 盤.getBoundingClientRect();
    var 列 = Math.floor((x - 枠.left - 3 - 寸.時刻の幅) / 寸.列の幅);
    var 指の段 = Math.floor((y - 枠.top - 3 - 寸.見出しの高さ) / 寸.段の高さ);
    if (列 < 0 || 列 >= 担当たち.length) return null;
    return { 日: 表示の日, 担当: 担当たち[列], 段: 芯.行き先の段(指の段, 持ち.つかんだ段) };
  }

  // 日のタブに乗っている時：離すと、同じ担当・同じ時刻でその日へ。少し待つと、その日の盤に替わる
  function タブに乗っている(タブ, x, y) {
    if (持ち.上のタブ !== タブ) {
      clearTimeout(持ち.タブの時計);
      持ち.上のタブ = タブ;
      if (タブ !== 表示の日) {
        持ち.タブの時計 = setTimeout(function () {
          if (持ち && 持ち.上のタブ === タブ) 日を替える(タブ);
        }, 設定.タブを待つ秒 * 1000);
      }
    }
    持ち.行き先 = { 日: タブ, 担当: 持ち.元.担当, 段: 持ち.元.段 };
    持ち.調べ = 芯.行き先を調べる(画面の駒たち, 持ち.番号, 持ち.行き先);
    影.hidden = true;
    タブの印(タブ, 持ち.調べ.形 !== '置ける' && 持ち.調べ.形 !== '同じ所');
    if (持ち.調べ.形 === '置ける') {
      吹き出しを出す('離すと ' + 名前たち[タブ] + ' ' + 持ち.元.担当 + ' ' + 芯.段から時刻(持ち.元.段) + ' へ動きます（少し待つと、その日の盤に替わります）', x, y, '注意');
    } else if (持ち.調べ.形 === '同じ所') {
      吹き出しを隠す();
    } else {
      吹き出しを出す(芯.知らせの文(持ち.調べ, 名前たち), x, y);
    }
  }

  function タブから降りた() {
    if (持ち.上のタブ === null || 持ち.上のタブ === undefined) return;
    clearTimeout(持ち.タブの時計);
    持ち.上のタブ = null;
    タブの印(null, false);
  }

  function 影を出す(x, y) {
    var 駒 = 芯.番号で探す(画面の駒たち, 持ち.番号);
    var 調べ = 持ち.調べ;
    if (!持ち.行き先) {
      影.hidden = true;
      吹き出しを出す(芯.知らせの文(調べ, 名前たち), x, y);
      return;
    }
    if (調べ.形 === '同じ所') {
      影.hidden = true;
      吹き出しを隠す();
      return;
    }
    var 列 = 芯.担当の列(持ち.行き先.担当);
    var 段 = Math.max(0, Math.min(段の数 - 駒.段数, 持ち.行き先.段));
    影.style.left = (マスの左(列) + 3) + 'px';
    影.style.top = (段の上(段) + 3) + 'px';
    影.style.width = (寸.列の幅 - 4) + 'px';
    影.style.height = (駒.段数 * 寸.段の高さ - 2) + 'px';
    影.classList.toggle('置けない', 調べ.形 !== '置ける');
    影.hidden = false;
    if (調べ.形 !== '置ける') 吹き出しを出す(芯.知らせの文(調べ, 名前たち), x, y);
    else if (調べ.休み) 吹き出しを出す(持ち.行き先.担当 + 'は休みです（置けます）', x, y, '注意');
    else 吹き出しを隠す();
  }

  // 置けた時は、置いた日の盤のまま。置けなかった・やめた時は、つかんだ時の日の盤へ戻す
  function 持ちを片付ける(置けた) {
    var 要素 = 持ち.要素;
    var 始めの日 = 持ち.始めの日;
    clearTimeout(持ち.タブの時計);
    try { 要素.releasePointerCapture(持ち.指); } catch (e) { /* もう放れている */ }
    要素.classList.remove('持ち上げ');
    要素.style.transform = '';
    持ち = null;
    影.hidden = true;
    タブの印(null, false);
    if (!置けた && 表示の日 !== 始めの日) 日を替える(始めの日);
    else 駒を描く();
  }

  function つかむ(e) {
    if (持ち || !幕.hidden || !表の姿) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var 要素 = e.target.closest ? e.target.closest('.駒') : null;
    if (!要素) return;
    var 駒 = 芯.番号で探す(画面の駒たち, Number(要素.getAttribute('data-番号')));
    if (!駒) return;
    e.preventDefault();
    触った();
    var 枠 = 盤.getBoundingClientRect();
    var 指の段 = Math.floor((e.clientY - 枠.top - 3 - 寸.見出しの高さ) / 寸.段の高さ);
    持ち = {
      番号: 駒.番号, 要素: 要素, 指: e.pointerId, つかんだ段: 芯.つかんだ段(駒, 指の段),
      元: { 日: 駒.日, 担当: 駒.担当, 段: 駒.段 }, 始めの日: 表示の日, 始めx: e.clientX, 始めy: e.clientY,
      動いた: false, 行き先: null, 調べ: null, 上のタブ: null, タブの時計: null
    };
    try { 要素.setPointerCapture(e.pointerId); } catch (err) { /* 指が離れている */ }
    要素.classList.add('持ち上げ');
    吹き出しを隠す();
  }

  function 動かしている(e) {
    if (!持ち || e.pointerId !== 持ち.指) return;
    var dx = e.clientX - 持ち.始めx;
    var dy = e.clientY - 持ち.始めy;
    if (!持ち.動いた && Math.abs(dx) + Math.abs(dy) < 5) return;
    持ち.動いた = true;
    持ち.要素.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(-4deg)';
    var タブ = 指の下のタブ(e.clientX, e.clientY);
    if (タブ !== null) {
      タブに乗っている(タブ, e.clientX, e.clientY);
      return;
    }
    タブから降りた();
    持ち.行き先 = 指の下の行き先(e.clientX, e.clientY);
    持ち.調べ = 持ち.行き先 ? 芯.行き先を調べる(画面の駒たち, 持ち.番号, 持ち.行き先) : { 形: 'はみ出す', どこ: '横' };
    影を出す(e.clientX, e.clientY);
  }

  function 離す(e) {
    if (!持ち || e.pointerId !== 持ち.指) return;
    var 今 = 持ち;
    var 置ける = 今.動いた && !!今.調べ && 今.調べ.形 === '置ける';
    持ちを片付ける(置ける);
    if (!今.動いた || !今.調べ || 今.調べ.形 === '同じ所') {
      吹き出しを隠す();
      return;
    }
    if (!置ける) {
      様子を書く(芯.知らせの文(今.調べ, 名前たち), '注意');
      吹き出しを隠す(true);
      return;
    }
    var 結果 = 動かす(今.番号, 今.元, 今.行き先);
    if (今.行き先.日 !== 表示の日) {
      // 見ていない日へ動いた（タブの上で離した）。駒は見えなくなるので、どこへ行ったかを言う
      タブを光らせる(今.行き先.日);
      吹き出しを出す(名前たち[今.行き先.日] + ' ' + 今.行き先.担当 + ' ' + 芯.段から時刻(今.行き先.段) + ' へ動かしました' +
        (結果.休み ? '（' + 今.行き先.担当 + 'は休みの日です）' : ''), e.clientX, e.clientY, '注意');
      吹き出しを隠す(true);
    } else if (結果.休み) {
      吹き出しを出す(芯.知らせの文(結果, 名前たち), e.clientX, e.clientY, '注意');
      吹き出しを隠す(true);
    } else {
      吹き出しを隠す();
    }
  }

  function やめる(文) {
    if (!持ち) return;
    持ちを片付ける(false);
    吹き出しを隠す();
    if (文) 様子を書く(文);
  }

  駒の層.addEventListener('pointerdown', つかむ);
  駒の層.addEventListener('pointermove', 動かしている);
  駒の層.addEventListener('pointerup', 離す);
  駒の層.addEventListener('pointercancel', function (e) { if (持ち && e.pointerId === 持ち.指) やめる('動かすのをやめました'); });
  駒の層.addEventListener('lostpointercapture', function (e) { if (持ち && e.pointerId === 持ち.指) やめる(''); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && 持ち) {
      e.preventDefault();
      やめる('動かすのをやめました');
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      待った();
    }
  });
  待ったのボタン.addEventListener('click', 待った);
  はじめのボタン.addEventListener('click', はじめに戻す);
  幕のボタン.addEventListener('click', はじめに戻す);

  // ---------- 読み直し（20秒おきと、窓に戻った時。10分さわらなければ止める） ----------
  function 触った() {
    最後に触った = Date.now();
    if (!読み直しの番) 読み直しを始める();
  }

  function 読み直しを始める() {
    読み直しの番 = setInterval(function () {
      if (document.hidden || 持ち || 送る列.length || !表の姿) return;
      if (Date.now() - 最後に触った > 設定.止めるまでの分 * 60000) {
        clearInterval(読み直しの番);
        読み直しの番 = null;
        様子を書く('しばらく動きが無いので、読み直しを止めました。駒を動かすと、また読み直します');
        return;
      }
      読む('盤を読む');
    }, 設定.読み直しの秒 * 1000);
  }

  function 戻ってきた() {
    if (document.hidden || 持ち || 送る列.length || !表の姿) return;
    触った();
    読む('盤を読む');
  }
  window.addEventListener('focus', 戻ってきた);
  document.addEventListener('visibilitychange', 戻ってきた);

  // 盤の寸法は幅だけで決まる。高さだけが変わった時（窓や枠の高さが変わる）は描き直さず、つかんでいる駒もそのまま
  var 寸の時計 = null;
  var 前の幅 = 0;
  window.addEventListener('resize', function () {
    clearTimeout(寸の時計);
    寸の時計 = setTimeout(function () {
      var 幅 = 盤の場所.clientWidth;
      if (幅 === 前の幅) return;
      前の幅 = 幅;
      if (持ち) やめる('');
      背景を描く();
      駒を描く();
    }, 120);
  });

  // 確かめのために、いまの様子を読めるようにしておく（読むだけ）
  window.予定の盤 = Object.freeze({
    寸: function () { return Object.assign({}, 寸); },
    駒たち: function () { return 芯.写す(画面の駒たち); },
    送る列の長さ: function () { return 送る列.length; },
    表示の日: function () { return 表示の日; },
    版: function () { return 表の姿 ? 表の姿.版 : null; }
  });

  // ---------- はじめ ----------
  背景を描く();
  前の幅 = 盤の場所.clientWidth;
  棋譜を描く();
  ボタンを整える();
  読む('開く');
  読み直しを始める();
})();
</script>
</body>
</html>
