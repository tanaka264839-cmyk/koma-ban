<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<base target="_blank">
<title>予定の盤</title>
<style>
:root {
  color-scheme: light;
  --地: #f6f1e7;
  --字: #2b2118;
  --薄い字: #5a4a3a;
  --線: #6b4a2b;
  --駒の縁: #7a5634;
  --赤: #b23a2a;
}
html, body { margin: 0; background: var(--地); color: var(--字); }
body { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; font-size: 15px; line-height: 1.6; }
.全体 { max-width: 1180px; margin: 0 auto; padding: 12px 16px 28px; box-sizing: border-box; }
h1 { font-size: 22px; margin: 2px 0 0; letter-spacing: 1px; }
.副 { margin: 0; color: var(--薄い字); font-size: 14px; }
.案内 { margin: 8px 0 10px; font-weight: bold; }
main { display: flex; gap: 20px; align-items: flex-start; }
.盤の場所 { flex: 1 1 auto; min-width: 0; position: relative; }
.横 { flex: 0 0 340px; min-width: 0; }
@media (max-width: 900px) {
  main { flex-direction: column; }
  .横 { flex-basis: auto; width: 100%; }
}
.日のタブ { display: flex; gap: 6px; margin: 0 auto; padding-left: 4px; box-sizing: border-box; }
.日のタブ button { border-radius: 8px 8px 0 0; border-bottom: 0; background: #fffaf2; padding: 4px 12px; font-size: 14px; }
.日のタブ button[aria-selected="true"] { background: #e9c27c; }
.日のタブ button.乗っている { outline: 3px dashed var(--線); outline-offset: -3px; }
.日のタブ button.乗っている.置けない { outline-color: var(--赤); }
.日のタブ button.光る { animation: 光る 1.2s ease; }
@keyframes 光る { 0% { background: #fff1a8; } 100% { background: #fffaf2; } }
.日のタブ[hidden] { display: none; }
.盤 {
  position: relative; margin: 0 auto;
  background: linear-gradient(135deg, #e9c27c 0%, #dcae63 55%, #e4ba72 100%);
  border: 3px solid #5b3d22; border-radius: 6px; box-shadow: 0 6px 18px rgba(70, 45, 20, .3);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.背景, .駒の層 { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
.背景 > div { position: absolute; box-sizing: border-box; }
.列の見出し { line-height: 30px; text-align: center; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; color: #2b1a0c; }
.列の見出し.休み { color: #5a4632; font-size: 12px; }
.細い .列の見出し { line-height: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; }
.細い .列の見出し.休み { font-size: 10px; }
.休みの列 { background: rgba(90, 60, 30, .28); }
.横線 { border-top: 1px dotted rgba(91, 61, 34, .55); }
.横線.太 { border-top: 1px solid var(--線); }
.縦線 { border-left: 1px solid var(--線); }
.時刻 { text-align: right; font-size: 12px; font-weight: bold; color: #3d2a18; line-height: 16px; }
.駒 { position: absolute; z-index: 3; cursor: grab; touch-action: none; }
.駒:not(.持ち上げ) { transition: left .15s ease, top .15s ease; }
.駒の縁, .駒の面 { position: absolute; clip-path: polygon(50% 0, 94% 9px, 100% 100%, 0 100%, 6% 9px); }
.駒の縁 { left: 0; top: 0; right: 0; bottom: 0; background: var(--駒の縁); }
.駒の面 {
  left: 1px; top: 1px; right: 1px; bottom: 1px; background: linear-gradient(180deg, #fbe9c4, #f0d29a);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px 2px 1px; box-sizing: border-box; text-align: center; overflow: hidden;
}
.駒の時 { font-size: 10px; font-weight: bold; color: #5a4632; line-height: 1.1; }
.駒の名 { font-family: "Yu Mincho", "游明朝", "Hiragino Mincho ProN", "MS Mincho", serif; font-weight: bold; font-size: 13px; line-height: 1.2; color: #24170d; }
.細い .駒の面 { padding-top: 6px; }
.細い .駒の時 { font-size: 9px; }
.細い .駒の名 { font-size: 11px; }
.駒.持ち上げ { z-index: 10; cursor: grabbing; filter: drop-shadow(0 12px 9px rgba(40, 25, 10, .45)); }
.影 { position: absolute; z-index: 9; border: 3px dashed var(--線); border-radius: 6px; box-sizing: border-box; background: rgba(255, 250, 240, .35); pointer-events: none; }
.影.置けない { border-color: var(--赤); background: rgba(255, 235, 230, .55); }
.吹き出し {
  position: absolute; z-index: 20; max-width: 290px; background: #fff4f1; border: 2px solid var(--赤); color: #8f2416;
  font-weight: bold; font-size: 14px; line-height: 1.5; padding: 6px 10px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0, 0, 0, .15); pointer-events: none;
}
.吹き出し.注意 { background: #fffbea; border-color: #8a6d00; color: #5c4800; }
.様子 { border: 2px solid #222; border-radius: 6px; background: #fff; padding: 6px 10px; font-weight: bold; min-height: 1.6em; }
.様子.書いている { border-color: #8a6d00; }
.様子.注意 { border-color: var(--赤); color: #8f2416; }
.ボタン { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
button { font: inherit; font-weight: bold; border: 2px solid #5b3d22; border-radius: 6px; background: #fff; padding: 6px 12px; cursor: pointer; color: var(--字); }
button:disabled { opacity: .45; cursor: default; }
.鍵の字 { font-size: 12px; color: var(--薄い字); margin-left: 6px; font-weight: normal; }
.横 h2 { font-size: 15px; margin: 14px 0 6px; }
.棋譜 { list-style: none; margin: 0; padding: 8px 10px; background: #fffaf2; border: 1px solid #cdb79a; border-radius: 8px; max-height: 190px; overflow-y: auto; font-size: 14px; }
.棋譜 li { margin: 2px 0; }
.棋譜 li.書いている, .棋譜 li.空 { color: var(--薄い字); }
.小 { font-size: 12px; color: var(--薄い字); margin: 0 0 4px; }
.表の中身 { overflow-x: auto; background: #fff; border: 1px solid #999; border-radius: 6px; }
.表の中身 table { border-collapse: collapse; font-size: 11px; table-layout: fixed; width: 100%; }
.表の中身 td { border: 1px solid #d0d0d0; padding: 0 2px; height: 16px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.表の中身 col.行番の列 { width: 24px; }
.表の中身 col.時刻の列 { width: 40px; }
.表の中身 td.行番, .表の中身 td.時刻の枡 { text-overflow: clip; }
@media (max-width: 480px) { .表の中身 table { font-size: 10px; } }
.表の中身 tr.頭 td, .表の中身 td.行番 { background: #eee; color: #555; text-align: center; }
.幕 { position: absolute; z-index: 30; left: 0; top: 0; right: 0; bottom: 0; background: rgba(246, 241, 231, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; text-align: center; }
.幕[hidden] { display: none; }
.幕 p { font-weight: bold; max-width: 480px; margin: 0 0 12px; }
footer { margin-top: 18px; font-size: 12px; color: var(--薄い字); }
</style>
</head>
<body>
<div class="全体">
  <header>
    <h1>予定の盤</h1>
    <p class="副">Google スプレッドシートと Google Apps Script で動いています</p>
  </header>
  <main>
    <section class="盤の場所" id="盤の場所">
      <p class="案内">駒をつかんで、動かしてみてください。日のタブに乗せると、ほかの日へも動かせます</p>
      <div class="日のタブ" id="日のタブ" role="tablist" aria-label="盤の日" hidden></div>
      <div class="盤" id="盤" aria-label="予定の盤（担当×時刻）">
        <div class="背景" id="背景"></div>
        <div class="駒の層" id="駒の層"></div>
        <div class="影" id="影" hidden></div>
        <div class="吹き出し" id="吹き出し" hidden></div>
      </div>
      <div class="幕" id="幕" hidden>
        <p id="幕の字"></p>
        <button type="button" id="幕のボタン" hidden>はじめの形に戻す</button>
      </div>
    </section>
    <aside class="横">
      <div class="様子" id="様子" role="status" aria-live="polite">表を読んでいます…</div>
      <div class="ボタン">
        <button type="button" id="待った">待った（一手戻す）<span class="鍵の字">Ctrl+Z</span></button>
        <button type="button" id="はじめ">はじめの形に戻す</button>
      </div>
      <h2>棋譜（動かした記録）</h2>
      <ol class="棋譜" id="棋譜"></ol>
      <h2>Google スプレッドシートのいまの中身</h2>
      <p class="小">表の「盤」のシートを、動かすたびに読み戻しています</p>
      <div class="表の中身" id="表の中身"></div>
    </aside>
  </main>
  <footer>この盤の人と予定は、すべて作り物です。盤はみんなで1つです（ほかの人が動かすと、こちらにも出ます）。10分だれも動かさないと、はじめの形に戻ります。</footer>
</div>
<!--芯をここに入れる-->
<script>
(function () {
  'use strict';

  // 確かめの時だけ、待ちの秒などを短くできる（ふだんは下の数のまま）
  var 設定 = Object.assign({ 書く待ちの秒: 20, 読む待ちの秒: 20, 読み直しの秒: 20, 止めるまでの分: 10, 吹き出しの秒: 3, タブを待つ秒: 0.45 }, window.予定の盤の設定 || {});
  var 担当たち = 芯.担当たち;
  var 段の数 = 芯.段の数;

  var 要 = function (id) { return document.getElementById(id); };
  var 盤の場所 = 要('盤の場所'), 盤 = 要('盤'), 背景 = 要('背景'), 駒の層 = 要('駒の層'), 影 = 要('影'), 吹き出し = 要('吹き出し');
  var 様子 = 要('様子'), 棋譜の欄 = 要('棋譜'), 表の中身 = 要('表の中身');
  var 幕 = 要('幕'), 幕の字 = 要('幕の字'), 幕のボタン = 要('幕のボタン');
  var 待ったのボタン = 要('待った'), はじめのボタン = 要('はじめ'), 日のタブ = 要('日のタブ');

  // ---------- 状態 ----------
  var 表の姿 = null;     // 最後に表から届いた姿（版・日たち・駒たち・盤の中身・棋譜・戻せる手・手数）
  var 表示の日 = 0;      // いま盤に出している日（0・1・2）
  var 名前たち = [];     // 日の名前（「11/27(金)」…）
  var 画面の駒たち = []; // 見えている駒（表の姿に、まだ表に書いていない手を重ねた物）
  var 送る列 = [];       // まだ表に書き終えていない手（古い順。先頭は返事を待っている手）
  var 送っている = null;
  var 世代 = 0;          // 表に合わせ直すたびに上げる。前の世代の返事は使わない
  var 書いた回数 = 0;    // 書き終えた回数。読み始めた後に書いた時は、その読みを使わない
  var 通し = 0;
  var 持ち = null;       // つかんでいる駒
  var 寸 = null;
  var 最後に触った = Date.now();
  var 読み直しの番 = null;
  var 吹き出しの時計 = null;
  var 読み始めた = false;

  // ---------- 盤の寸法と背景 ----------
  function 寸を測る() {
    var 幅 = Math.max(300, 盤の場所.clientWidth);
    var 時刻の幅 = 幅 < 480 ? 40 : 48;
    // 盤の幅（時刻＋6列＋内の余白8）と枠の線（左右3ずつ）が、置き場の幅に収まるようにする
    var 列の幅 = Math.max(44, Math.min(104, Math.floor((幅 - 時刻の幅 - 16) / 担当たち.length)));
    var 段の高さ = 列の幅 < 60 ? 24 : 26;
    var 見出しの高さ = 30;
    return {
      時刻の幅: 時刻の幅, 列の幅: 列の幅, 段の高さ: 段の高さ, 見出しの高さ: 見出しの高さ,
      幅: 時刻の幅 + 列の幅 * 担当たち.length + 8,
      高さ: 見出しの高さ + 段の高さ * 段の数 + 8,
      細い: 列の幅 < 60
    };
  }
  function マスの左(列) { return 寸.時刻の幅 + 列 * 寸.列の幅; }
  function 段の上(段) { return 寸.見出しの高さ + 段 * 寸.段の高さ; }

  function 箱(組, 左, 上, 幅, 高さ) {
    var e = document.createElement('div');
    e.className = 組;
    e.style.left = 左 + 'px';
    e.style.top = 上 + 'px';
    e.style.width = 幅 + 'px';
    e.style.height = 高さ + 'px';
    return e;
  }

  function 背景を描く() {
    寸 = 寸を測る();
    盤.style.width = 寸.幅 + 'px';
    盤.style.height = 寸.高さ + 'px';
    日のタブ.style.width = (寸.幅 + 6) + 'px';
    盤.classList.toggle('細い', 寸.細い);
    背景.textContent = '';
    var 欠片 = document.createDocumentFragment();
    担当たち.forEach(function (担当, 列) {
      var 休み = 芯.休みか(担当, 表示の日);
      var 見出し = 箱('列の見出し' + (休み ? ' 休み' : ''), マスの左(列), 0, 寸.列の幅, 寸.見出しの高さ);
      var 名 = document.createElement('span');
      名.textContent = 担当;
      見出し.appendChild(名);
      if (休み) {
        var 印 = document.createElement('span');
        印.textContent = '（休み）';
        見出し.appendChild(印);
      }
      欠片.appendChild(見出し);
      if (休み) 欠片.appendChild(箱('休みの列', マスの左(列), 段の上(0), 寸.列の幅, 寸.段の高さ * 段の数));
    });
    for (var 段 = 0; 段 <= 段の数; 段++) {
      欠片.appendChild(箱(段 % 2 === 0 ? '横線 太' : '横線', 寸.時刻の幅, 段の上(段), 寸.列の幅 * 担当たち.length, 0));
      if (段 % 2 === 0) {
        var 時 = 箱('時刻', 0, 段の上(段) - 8, 寸.時刻の幅 - 6, 16);
        時.textContent = 芯.段から時刻(段);
        欠片.appendChild(時);
      }
    }
    for (var 列 = 0; 列 <= 担当たち.length; 列++) 欠片.appendChild(箱('縦線', マスの左(列), 段の上(0), 0, 寸.段の高さ * 段の数));
    背景.appendChild(欠片);
    背景.setAttribute('data-日', String(表示の日));
  }

  // ---------- 駒を描く ----------
  function 駒の要素を作る(駒) {
    var e = document.createElement('div');
    e.className = '駒';
    e.setAttribute('data-番号', String(駒.番号));
    e.setAttribute('role', 'img');
    var 縁 = document.createElement('div');
    縁.className = '駒の縁';
    var 面 = document.createElement('div');
    面.className = '駒の面';
    var 時 = document.createElement('span');
    時.className = '駒の時';
    var 名 = document.createElement('span');
    名.className = '駒の名';
    面.appendChild(時);
    面.appendChild(名);
    e.appendChild(縁);
    e.appendChild(面);
    return e;
  }

  function 駒を置く(e, 駒) {
    var 列 = 芯.担当の列(駒.担当);
    e.style.left = (マスの左(列) + 3) + 'px';
    e.style.top = (段の上(駒.段) + 2) + 'px';
    e.style.width = (寸.列の幅 - 6) + 'px';
    e.style.height = (駒.段数 * 寸.段の高さ - 4) + 'px';
    e.setAttribute('data-担当', 駒.担当);
    e.setAttribute('data-段', String(駒.段));
    e.querySelector('.駒の時').textContent = 芯.段から時刻(駒.段);
    e.querySelector('.駒の名').textContent = 駒.予定;
    e.setAttribute('aria-label', 駒.予定 + '　' + 駒.担当 + ' ' + 芯.段から時刻(駒.段) + '〜' + 芯.段から時刻(駒.段 + 駒.段数));
  }

  function 駒を描く() {
    var ある = {};
    Array.prototype.forEach.call(駒の層.children, function (e) { ある[e.getAttribute('data-番号')] = e; });
    画面の駒たち.forEach(function (駒) {
      if (駒.日 !== 表示の日 && !(持ち && 持ち.番号 === 駒.番号)) return; // ほかの日の駒は出さない（つかんでいる駒は残す）
      var e = ある[String(駒.番号)];
      if (!e) {
        e = 駒の要素を作る(駒);
        駒の層.appendChild(e);
      }
      delete ある[String(駒.番号)];
      if (持ち && 持ち.番号 === 駒.番号) return;
      駒を置く(e, 駒);
    });
    Object.keys(ある).forEach(function (番号) { ある[番号].remove(); });
  }

  // ---------- 様子・吹き出し・幕 ----------
  function 様子を書く(文, 種類) {
    様子.textContent = 文;
    様子.className = '様子' + (種類 ? ' ' + 種類 : '');
  }

  function 吹き出しを出す(文, x, y, 種類) {
    clearTimeout(吹き出しの時計);
    吹き出し.textContent = 文;
    吹き出し.className = '吹き出し' + (種類 ? ' ' + 種類 : '');
    吹き出し.hidden = false;
    var 枠 = 盤.getBoundingClientRect();
    var 左 = Math.max(4, Math.min(x - 枠.left - 30, 寸.幅 - 吹き出し.offsetWidth - 4));
    var 上 = y - 枠.top + 26;
    if (上 + 吹き出し.offsetHeight > 寸.高さ) 上 = y - 枠.top - 吹き出し.offsetHeight - 26;
    吹き出し.style.left = 左 + 'px';
    吹き出し.style.top = Math.max(4, 上) + 'px';
  }

  function 吹き出しを隠す(少し残す) {
    clearTimeout(吹き出しの時計);
    if (少し残す) {
      吹き出しの時計 = setTimeout(function () { 吹き出し.hidden = true; }, 設定.吹き出しの秒 * 1000);
    } else {
      吹き出し.hidden = true;
    }
  }

  function 幕を出す(文, ボタンも) {
    幕の字.textContent = 文;
    幕のボタン.hidden = !ボタンも;
    幕.hidden = false;
  }

  function 幕を閉じる() { 幕.hidden = true; }

  // ---------- 日のタブ ----------
  function タブを描く() {
    日のタブ.textContent = '';
    var 日たち = 表の姿 && 表の姿.日たち;
    if (!日たち) {
      日のタブ.hidden = true;
      return;
    }
    名前たち = 芯.日の名前たち(日たち);
    名前たち.forEach(function (名, 日) {
      var タブ = document.createElement('button');
      タブ.type = 'button';
      タブ.setAttribute('role', 'tab');
      タブ.setAttribute('data-日', String(日));
      タブ.setAttribute('aria-selected', 日 === 表示の日 ? 'true' : 'false');
      タブ.textContent = 名;
      日のタブ.appendChild(タブ);
    });
    日のタブ.hidden = false;
  }

  function 日を替える(日) {
    if (日 === 表示の日) return;
    表示の日 = 日;
    背景を描く();
    駒を描く();
    タブを描く();
    表の中身を描く();
  }

  function タブを光らせる(日) {
    var タブ = 日のタブ.querySelector('[data-日="' + 日 + '"]');
    if (!タブ) return;
    タブ.classList.remove('光る');
    void タブ.offsetWidth; // 続けて光らせる時も、はじめから
    タブ.classList.add('光る');
  }

  function 指の下のタブ(x, y) {
    var タブたち = 日のタブ.hidden ? [] : 日のタブ.querySelectorAll('button');
    for (var i = 0; i < タブたち.length; i++) {
      var 枠 = タブたち[i].getBoundingClientRect();
      if (x >= 枠.left && x <= 枠.right && y >= 枠.top && y <= 枠.bottom) return Number(タブたち[i].getAttribute('data-日'));
    }
    return null;
  }

  function タブの印(日, 置けない) {
    Array.prototype.forEach.call(日のタブ.querySelectorAll('button'), function (タブ) {
      var 乗る = 日 !== null && Number(タブ.getAttribute('data-日')) === 日;
      タブ.classList.toggle('乗っている', 乗る);
      タブ.classList.toggle('置けない', 乗る && 置けない);
    });
  }

  日のタブ.addEventListener('click', function (e) {
    var タブ = e.target.closest ? e.target.closest('button') : null;
    if (!タブ || 持ち) return;

      吹き出しを隠す(true);
      return;
    }
    var 結果 = 動かす(今.番号, 今.元, 今.行き先);
    if (今.行き先.日 !== 表示の日) {
      // 見ていない日へ動いた（タブの上で離した）。駒は見えなくなるので、どこへ行ったかを言う
      タブを光らせる(今.行き先.日);
      吹き出しを出す(名前たち[今.行き先.日] + ' ' + 今.行き先.担当 + ' ' + 芯.段から時刻(今.行き先.段) + ' へ動かしました' +
        (結果.休み ? '（' + 今.行き先.担当 + 'は休みの日です）' : ''), e.clientX, e.clientY, '注意');
      吹き出しを隠す(true);
    } else if (結果.休み) {
      吹き出しを出す(芯.知らせの文(結果, 名前たち), e.clientX, e.clientY, '注意');
      吹き出しを隠す(true);
    } else {
      吹き出しを隠す();
    }
  }

  function やめる(文) {
    if (!持ち) return;
    持ちを片付ける(false);
    吹き出しを隠す();
    if (文) 様子を書く(文);
  }

  駒の層.addEventListener('pointerdown', つかむ);
  駒の層.addEventListener('pointermove', 動かしている);
  駒の層.addEventListener('pointerup', 離す);
  駒の層.addEventListener('pointercancel', function (e) { if (持ち && e.pointerId === 持ち.指) やめる('動かすのをやめました'); });
  駒の層.addEventListener('lostpointercapture', function (e) { if (持ち && e.pointerId === 持ち.指) やめる(''); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && 持ち) {
      e.preventDefault();
      やめる('動かすのをやめました');
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      待った();
    }
  });
  待ったのボタン.addEventListener('click', 待った);
  はじめのボタン.addEventListener('click', はじめに戻す);
  幕のボタン.addEventListener('click', はじめに戻す);

  // ---------- 読み直し（20秒おきと、窓に戻った時。10分さわらなければ止める） ----------
  function 触った() {
    最後に触った = Date.now();
    if (!読み直しの番) 読み直しを始める();
  }

  function 読み直しを始める() {
    読み直しの番 = setInterval(function () {
      if (document.hidden || 持ち || 送る列.length || !表の姿) return;
      if (Date.now() - 最後に触った > 設定.止めるまでの分 * 60000) {
        clearInterval(読み直しの番);
        読み直しの番 = null;
        様子を書く('しばらく動きが無いので、読み直しを止めました。駒を動かすと、また読み直します');
        return;
      }
      読む('盤を読む');
    }, 設定.読み直しの秒 * 1000);
  }

  function 戻ってきた() {
    if (document.hidden || 持ち || 送る列.length || !表の姿) return;
    触った();
    読む('盤を読む');
  }
  window.addEventListener('focus', 戻ってきた);
  document.addEventListener('visibilitychange', 戻ってきた);

  // 盤の寸法は幅だけで決まる。高さだけが変わった時（窓や枠の高さが変わる）は描き直さず、つかんでいる駒もそのまま
  var 寸の時計 = null;
  var 前の幅 = 0;
  window.addEventListener('resize', function () {
    clearTimeout(寸の時計);
    寸の時計 = setTimeout(function () {
      var 幅 = 盤の場所.clientWidth;
      if (幅 === 前の幅) return;
      前の幅 = 幅;
      if (持ち) やめる('');
      背景を描く();
      駒を描く();
    }, 120);
  });

  // 確かめのために、いまの様子を読めるようにしておく（読むだけ）
  window.予定の盤 = Object.freeze({
    寸: function () { return Object.assign({}, 寸); },
    駒たち: function () { return 芯.写す(画面の駒たち); },
    送る列の長さ: function () { return 送る列.length; },
    表示の日: function () { return 表示の日; },
    版: function () { return 表の姿 ? 表の姿.版 : null; }
  });

  // ---------- はじめ ----------
  背景を描く();
  前の幅 = 盤の場所.clientWidth;
  棋譜を描く();
  ボタンを整える();
  読む('開く');
  読み直しを始める();
})();
</script>
</body>
</html>
